<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.R.V.I.S.</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">J</div>
          <div>
            <h1>J.A.R.V.I.S.</h1>
            <span>JUST A RATHER VERY INTELLIGENT SYSTEM</span>
          </div>
        </div>
        <div class="top-status">
          <span class="status-dot"></span>
          <span id="sys-status">ONLINE</span>
          <span class="clock" id="clock">--:--:--</span>
        </div>
      </header>

      <main class="main">
        <section class="conversation-panel">
          <div class="section-heading">
            <div>
              <span class="eyebrow">J.A.R.V.I.S. CORE</span>
              <h2>Conversation</h2>
            </div>
            <div class="state-pill" id="state">READY</div>
          </div>

          <div class="chat-wrap">
            <div class="chat-log" id="chat-log" aria-live="polite">
              <div class="message system">
                <div class="message-body">
                  J.A.R.V.I.S. online. I'm listening.
                </div>
              </div>
            </div>
            <button class="jump-latest" id="jump-latest" type="button" hidden>
              ↓ Latest
            </button>
          </div>
        </section>

        <aside class="side-panel">
          <section class="card">
            <div class="card-title">SYSTEM</div>
            <div class="metric">
              <div class="metric-row">
                <span>CPU</span><strong id="cpu-val">--%</strong>
              </div>
              <div class="bar"><i id="cpu-bar"></i></div>
            </div>
            <div class="metric">
              <div class="metric-row">
                <span>RAM</span><strong id="mem-val">--%</strong>
              </div>
              <div class="bar"><i id="mem-bar"></i></div>
            </div>
            <div class="network">
              <span>NETWORK</span>
              <strong><b class="status-dot"></b> ONLINE</strong>
            </div>
          </section>

          <section class="card memory-card">
            <div class="card-title">MEMORY</div>
            <div class="memory-list" id="mem-list">
              <div class="muted">No memories loaded.</div>
            </div>
          </section>
        </aside>
      </main>

      <section class="quick-actions">
        <div class="section-heading compact">
          <div>
            <span class="eyebrow">SHORTCUTS</span>
            <h2>Quick actions</h2>
          </div>
        </div>
        <div class="quick-grid">
          <button data-command="open YouTube">YouTube</button>
          <button data-command="open browser">Browser</button>
          <button data-command="system status">System</button>
          <button data-command="take a screenshot">Screenshot</button>
          <button data-command="open my files">Files</button>
          <button data-command="sleep">Sleep</button>
        </div>
      </section>

      <footer class="command-area">
        <div class="voice-status">
          <span class="status-dot"></span>
          <span id="wake-status">STANDBY</span>
          <span class="voice-hint">Say “Hey JARVIS” to begin</span>
        </div>
        <div class="command-row">
          <input
            id="cmd-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Talk to JARVIS…"
            aria-label="Message JARVIS"
          />
          <button class="send-btn" id="send-btn" type="button">SEND</button>
        </div>
        <div class="control-row">
          <button class="control primary" id="mic-btn" type="button">
            🎙 VOICE
          </button>
          <button class="control danger" id="stop-btn" type="button">
            ■ STOP
          </button>
          <button class="control" id="reset-btn" type="button">↻ RESET</button>
        </div>
      </footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
